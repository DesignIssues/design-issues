<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fefefe"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1c5a7a"/>

  <!-- faint URI motif, the book's subject -->
  <g opacity="0.10">
    <text x="600" y="596" text-anchor="middle"
          font-family="'Courier New',Courier,monospace" font-size="26" fill="#1c5a7a">https://www.w3.org/DesignIssues/</text>
  </g>

  <!-- rule pair, echoing the chapter headers -->
  <line x1="150" y1="150" x2="1050" y2="150" stroke="#1c5a7a" stroke-width="2"/>

  <text x="600" y="278" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="96" letter-spacing="14" fill="#2f4f4f">DESIGN ISSUES</text>

  <text x="600" y="338" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="34" font-style="italic" fill="#555">The Web&#8217;s design notes, put in order</text>

  <text x="600" y="398" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="30" fill="#999">&#167;</text>

  <text x="600" y="452" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="27" fill="#666">96 chapters in ten volumes, from the notes of Tim Berners-Lee</text>

  <line x1="150" y1="498" x2="1050" y2="498" stroke="#ddd" stroke-width="1"/>
  <text x="600" y="534" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="23" letter-spacing="3" fill="#1c5a7a">EDITED BY MELVIN CARVALHO</text>
</svg>
